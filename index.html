<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f0e8">
  <meta name="description" content="鹿鱼集，铅笔手绘风格的便当盒个人记录站。">
  <title>鹿鱼集 · 个人记录站</title>
  <link rel="icon" href="assets/ink-seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="sketch-shell">
    <header class="sketch-header">
      <a class="sketch-logo" href="index.html">
        <span>鹿</span>
        <div><strong>鹿鱼集</strong><small>铅笔手记 · 自留地</small></div>
      </a>
      <nav class="sketch-nav" aria-label="主导航">
        <a href="notes.html">笔墨</a>
        <a href="photos.html">光影</a>
        <a href="guestbook.html">留言</a>
        <a href="about.html">关于</a>
      </nav>
      <a class="ours-icon" href="ours.html" title="我们的记录" aria-label="我们的记录">♥</a>
    </header>

    <main class="sketch-grid">
      <section class="sketch-card card-hero">
        <span class="card-note">鹿鱼集 · 二〇二六</span>
        <h1>把日子<br>收进<em>一格一格</em></h1>
        <p>文字、照片、留言，和那些不肯散场的日常，都安静地放在这里。</p>
        <div class="hero-actions">
          <a class="sketch-btn sketch-btn-dark" href="notes.html">开始阅读 <span>→</span></a>
          <a class="sketch-btn sketch-btn-light" href="guestbook.html">留一句话</a>
        </div>
      </section>

      <a class="sketch-card card-notes" href="notes.html">
        <span class="card-note">01 · 笔墨</span>
        <span class="card-char">墨</span>
        <strong>随笔与近来的字</strong>
        <p>一些没写完的念头，和一些值得留下的普通日子。</p>
        <i>翻开这本手记 →</i>
      </a>

      <a class="sketch-card card-photos" href="photos.html">
        <span class="card-note">02 · 光影</span>
        <span class="card-char">影</span>
        <strong>照片与日常</strong>
        <i>去看看 →</i>
      </a>

      <a class="sketch-card card-mail" href="guestbook.html">
        <span class="card-note">03 · 留言</span>
        <span class="card-char">信</span>
        <strong>有信自远方来</strong>
        <p>有什么想说的，就写在纸上。</p>
        <i>去留言板 →</i>
      </a>

      <a class="sketch-card card-about" href="about.html">
        <span class="card-note">04 · 关于</span>
        <span class="card-char">我</span>
        <strong>认识一下</strong>
        <i>更多 →</i>
      </a>

      <section class="sketch-card card-quote">
        <span class="quote-mark">「</span>
        <p>万物有灵，落笔为记。<em>慢慢写，慢慢活。</em></p>
        <span class="quote-by">鹿鱼集 · 二〇二六</span>
      </section>
    </main>

    <footer class="sketch-footer">
      <span>鹿鱼集</span>
      <p>一个人安静记录的地方。</p>
    </footer>
  </div>
</body>
</html>
